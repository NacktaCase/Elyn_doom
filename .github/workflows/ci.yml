# 커밋된 배포본이 실제로 부팅하는지 본다.
#
# wasi-sdk 도 28 MB WAD 다운로드도 쓰지 않는다 — dist-freedoom/ 이 저장소에
# 있으므로 거기서 엔진과 WAD 를 꺼내 그대로 돌린다. 갓 클론한 상태에서 도는
# 유일한 검증이고, 붙여넣는 사람이 받는 것과 같은 파일을 검사한다.
#
# 전체 검증(doom-selftest.cjs)은 빌드 산출물과 대조하므로 여기서 못 돈다.
# 그건 개발 기계에서 올리기 전에 돌린다 — docs/build.md 참고.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 의존성이 없다. Node 내장(zlib · WebAssembly)만 쓴다.
      - name: 배포본 스모크
        run: npm test

      # 타이틀 화면을 지나 어트랙트 루프까지 돌린다. 프루너가 데모용 맵을
      # 빠뜨리면 여기서만 잡힌다 — 가만히 두면 죽는 부류다.
      - name: 어트랙트 루프까지
        run: npm run smoke -- --ticks 1200
